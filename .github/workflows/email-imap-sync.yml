name: Email IMAP sync

# Polls ascolp@reforma.ng and files new mail into Reforma. Runs here rather
# than as a Vercel Cron because Vercel's Hobby plan only allows once-daily
# crons — far too infrequent for mail that should show up promptly. GitHub
# Actions' schedule trigger is best-effort (can slip a few minutes under
# load), which is fine for this.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync endpoint
        run: |
          # -L/--location-trusted: this has been silently hitting a domain-level
          # redirect (reforma.ng <-> www.reforma.ng — exact direction unconfirmed,
          # see investigation notes) and stopping there, since curl doesn't
          # follow redirects by default. That's why every run up to this fix
          # reported "success" while never actually reaching the route at all —
          # curl -f only fails on 4xx/5xx, not 3xx. --location-trusted (rather
          # than plain -L) is required so the Authorization header survives the
          # redirect to a different hostname — safe here since both hostnames
          # are our own domain.
          curl -sS -f -L --location-trusted -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://reforma.ng/api/cron/email-imap-sync -o response.json
          echo "Response:"
          cat response.json
